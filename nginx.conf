server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Ojo: nginx NO hereda add_header del server si un location define el suyo. Por eso las cabeceras de
    # seguridad se repiten en cada location (si no, se perderían en todas las páginas).
    # __API_ORIGIN__ lo reemplaza el Dockerfile con el origen de VITE_API_URL (vacío si el API es /api).

    # Assets con hash: caché larga. index.html: sin caché para que cada despliegue se vea de inmediato.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: __API_ORIGIN__; connect-src 'self' __API_ORIGIN__; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
